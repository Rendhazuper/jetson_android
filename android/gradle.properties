org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Cache & paralelisme untuk mempercepat build berulang.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Jalankan kompilasi Kotlin di dalam proses Gradle agar daemon Kotlin
# tidak mati saat startup pada mesin dengan RAM terbatas.
kotlin.compiler.execution.strategy=in-process
