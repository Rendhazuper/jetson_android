org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Cache & paralelisme untuk mempercepat build berulang.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Jalankan kompilasi Kotlin di dalam proses Gradle agar daemon Kotlin
# tidak mati saat startup pada mesin dengan RAM terbatas.
kotlin.compiler.execution.strategy=in-process
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Peringatan Flutter 3.47: Gradle 8.14, AGP 8.11.1, dan Kotlin 2.2.20 "akan segera
# tidak didukung". Naik ke Gradle 9 / AGP 9 saat ini gagal karena plugin
# onnxruntime 1.4.1 (compileSdk 33, classpath AGP 7.3.0) dan karena camera_android_camerax,
# google_mlkit_commons, google_mlkit_face_detection masih menerapkan KGP.
# Pengecekan dilewati sampai plugin-plugin itu diperbarui; jangan hapus tanpa
# menguji build.
skipDependencyChecks=true
